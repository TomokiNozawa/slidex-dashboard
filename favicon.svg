<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0eaff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>
  <!-- Slide shape (tilted rectangle) -->
  <rect x="7" y="7" width="18" height="13.5" rx="2" ry="2" fill="url(#slide)" transform="rotate(-3 16 13)"/>
  <!-- S letter -->
  <text x="16" y="24.5" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="url(#bg)" text-anchor="middle" dominant-baseline="auto">S</text>
  <!-- Small accent lines on slide -->
  <rect x="10" y="10" width="10" height="1.5" rx="0.75" fill="#3b82f6" opacity="0.3" transform="rotate(-3 16 13)"/>
  <rect x="10" y="13" width="7" height="1.5" rx="0.75" fill="#3b82f6" opacity="0.2" transform="rotate(-3 16 13)"/>
</svg>
